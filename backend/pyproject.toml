[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.18.5",
    "bcrypt>=5.0.0",
    "claude-agent-sdk>=0.1.0",
    "fastapi[standard]>=0.139.2",
    "httpx>=0.28.1",
    "numpy>=2.4.6",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2",
    "pyyaml>=6.0",
    "pyjwt>=2.13.0",
    "qdrant-client>=1.16.0",
    "redis>=7.0.0",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.51.0",
]

# T12-2 (D-68): the embed group is OPTIONAL. notes_search (one of four retrieval layers) needs the bkai CPU model.
# CI and deployment do not install it by default because torch is large; install it with `uv sync --extra embed`.
# Torch is pinned to CPU (no CUDA, per the "local CPU" specification). Without the library, notes_search returns a
# graceful env_missing response as designed by LAB, while the other three layers continue to operate.
[project.optional-dependencies]
scale = []
embed = [
    "sentence-transformers>=3.0",
    "pyvi>=0.1.1",
    "torch>=2.0",
]

# Install torch from the CPU-only index to avoid adding roughly 2.5 GB of CUDA data. This applies only to the embed extra.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.22",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# app.* lives in backend/ (.) and roles.* lives at the repository root (..), per the D-26 layout.
pythonpath = [".", ".."]

[tool.ruff]
line-length = 120
target-version = "py311"
# roles/ is the labpack copied from LAB (N1: the shell does not modify its logic), so exclude it from shell linting.
extend-exclude = ["app/db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# B008: Depends() in a default argument is the standard FastAPI idiom, so this is a false positive.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# email.py uses table-based HTML email with inline CSS (T9-2 addendum), where long lines are required because splitting
# inline CSS can break HTML or spam-filter compatibility. Ignore E501 only for this template file.
"app/notify/email.py" = ["E501"]
